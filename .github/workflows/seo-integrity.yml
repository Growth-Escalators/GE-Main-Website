name: SEO integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check sitemap, redirects, NAP and internal links
        run: node scripts/check-seo-integrity.mjs

      - name: Check Commercial V2 preservation contracts
        run: node scripts/check-commercial-v2.mjs

      - name: Lint
        run: npm run lint

      - name: Production build and static generation
        run: npm run build
