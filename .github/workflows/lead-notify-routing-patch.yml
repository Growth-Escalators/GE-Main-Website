name: Patch lead notification routing

on:
  push:
    branches:
      - fix/lead-notification-routing-20260825
    paths:
      - '.github/workflows/lead-notify-routing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lead-notification-routing-20260825
      - name: Patch notification routing
        run: python scripts/patch-lead-routing.py
      - name: Validate targeted routing changes
        run: |
          grep -q "jatin@growthescalators.com" app/api/lead/route.ts
          grep -q "info@growthescalators.com" app/api/lead/route.ts
          grep -q "LEAD_NOTIFY_FALLBACK_EMAIL" app/api/lead/route.ts
          grep -q "fallbackUsed" app/api/lead/route.ts
      - name: Install dependencies
        run: npm ci
      - name: Run SEO integrity checks
        run: node scripts/check-seo-integrity.mjs
      - name: Run Commercial V2 preservation checks
        run: node scripts/check-commercial-v2.mjs
      - name: Production build
        run: npm run build
      - name: Commit patched route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/lead/route.ts
          git commit -m "fix: route lead notifications through primary and fallback inboxes"
          git push origin HEAD:fix/lead-notification-routing-20260825
