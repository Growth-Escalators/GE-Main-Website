name: SEO Performance Audit

on:
  workflow_dispatch:
  push:
    branches:
      - feat/homepage-tinuiti-reference-rebuild
    paths:
      - .github/workflows/lighthouse-audit.yml

jobs:
  lighthouse:
    name: Mobile Lighthouse baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Run Lighthouse on representative live pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://www.growthescalators.com/
            https://www.growthescalators.com/d2c
            https://www.growthescalators.com/jewellery-marketing-agency-jaipur
          uploadArtifacts: true
          temporaryPublicStorage: true
