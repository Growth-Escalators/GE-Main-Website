name: Final site QA

on:
  push:
    branches:
      - feat/phase-8-refinement-release
  workflow_dispatch:

jobs:
  production-build-and-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/ge-next.log 2>&1 &
          echo $! > /tmp/ge-next.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ge-next.log
          exit 1

      - name: Crawl sitemap, internal links and lead contracts
        run: node scripts/release-qa.mjs http://127.0.0.1:3000

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/ge-next.log || true
