name: Phase 8 Release QA

on:
  push:
    branches:
      - feat/phase-8-refinement-release
  pull_request:
    branches:
      - feat/overnight-phases-4-7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'))
          console.log('Production vulnerability counts:', audit.metadata?.vulnerabilities || {})
          const entries = Object.entries(audit.vulnerabilities || {})
            .filter(([, value]) => value.severity === 'high' || value.severity === 'critical')
            .map(([name, value]) => ({ name, severity: value.severity, direct: value.isDirect, via: value.via, fixAvailable: value.fixAvailable }))
          console.log(JSON.stringify(entries, null, 2))
          NODE

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/ge-next.log 2>&1 &
          echo $! > /tmp/ge-next.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ge-next.log
          exit 1

      - name: Sitemap, canonical and internal-link crawl
        run: node scripts/release-qa.mjs http://127.0.0.1:3000

      - name: Lighthouse representative mobile templates
        run: |
          CHROME=$(which google-chrome || which chromium || which chromium-browser)
          echo "Using Chrome: $CHROME"
          export CHROME_PATH="$CHROME"
          for item in "home:/" "services:/services" "commercial:/d2c" "staffing:/staffing" "blog:/blog"; do
            name="${item%%:*}"
            path="${item#*:}"
            npx --yes lighthouse "http://127.0.0.1:3000${path}" \
              --quiet \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output-path="/tmp/lh-${name}.json"
          done
          node - <<'NODE'
          const fs = require('fs')
          const names = ['home', 'services', 'commercial', 'staffing', 'blog']
          const detailedIds = ['color-contrast','aria-hidden-focus','aria-prohibited-attr','heading-order','font-size']
          for (const name of names) {
            const report = JSON.parse(fs.readFileSync(`/tmp/lh-${name}.json`, 'utf8'))
            const c = report.categories
            const a = report.audits
            const pct = (value) => Math.round((value || 0) * 100)
            console.log(`\n=== ${name.toUpperCase()} ===`)
            console.log(`performance=${pct(c.performance.score)} accessibility=${pct(c.accessibility.score)} best-practices=${pct(c['best-practices'].score)} seo=${pct(c.seo.score)} LCP=${a['largest-contentful-paint']?.displayValue || '-'} CLS=${a['cumulative-layout-shift']?.displayValue || '-'} TBT=${a['total-blocking-time']?.displayValue || '-'}`)

            const shifts = a['layout-shifts']?.details?.items || []
            if (shifts.length) {
              console.log('layout shifts:')
              for (const item of shifts.slice(0, 8)) console.log(JSON.stringify(item, null, 2))
            }

            const lcp = a['largest-contentful-paint-element']?.details?.items || []
            if (lcp.length) console.log('LCP element:', JSON.stringify(lcp[0], null, 2))

            for (const id of detailedIds) {
              const audit = a[id]
              if (!audit || audit.score === 1 || audit.scoreDisplayMode === 'notApplicable') continue
              console.log(`AUDIT ${id}: ${audit.title} (${audit.displayValue || audit.score})`)
              const items = audit.details?.items || []
              for (const item of items.slice(0, 12)) {
                console.log(JSON.stringify({
                  node: item.node?.snippet,
                  selector: item.node?.selector,
                  explanation: item.node?.explanation,
                  contrastRatio: item.contrastRatio,
                  expectedContrastRatio: item.expectedContrastRatio,
                  fontSize: item.fontSize,
                  source: item.source,
                  subItems: item.subItems,
                }, null, 2))
              }
            }

            for (const id of ['render-blocking-resources','unused-javascript','unused-css-rules','mainthread-work-breakdown','bootup-time']) {
              const audit = a[id]
              if (audit?.displayValue) console.log(`${id}: ${audit.displayValue}`)
            }
          }
          NODE

      - name: Server log tail
        if: always()
        run: tail -n 120 /tmp/ge-next.log || true
